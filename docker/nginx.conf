server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/woff2;

    # Astro hash'li asset'ler: uzun süreli cache
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /wp-images/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Temiz URL'ler (Astro directory formatı: /posts/slug/index.html)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
